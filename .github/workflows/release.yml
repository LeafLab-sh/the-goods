name: Release

# release-please makes the releases from the commit messages on main. Each push
# to main updates a pull request titled "chore(main): release x.y.z", which
# holds the next version in gradle.properties and its entry in CHANGELOG.md.
# Merging it is the release.
#
# release-please acts as the org's automation App: only the App may create v*
# tags (org ruleset), and CI runs on a pull request the App opens. There is no
# fallback to the workflow's own token, so without the App's key the run fails.
#
# Releases are immutable once published, so release-please makes a draft
# release and its tag. The jar is built from the tag, tested, attached to the
# draft and published to CurseForge, and the draft is published last.

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      body: ${{ steps.release.outputs.body }}
    steps:
      - name: Take a token as the automation App
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.LEAFLAB_AUTOMATION_CLIENT_ID }}
          private-key: ${{ secrets.LEAFLAB_AUTOMATION_PRIVATE_KEY }}

      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      MOD_VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0
          fetch-tags: true

      - name: Setup build environment
        uses: ./.github/actions/setup-build-env

      - name: Build & Unit Test
        run: ./gradlew build -Pmod_version="$MOD_VERSION"

      - name: Run Integration Tests
        run: ./gradlew runGameTestServer -Pmod_version="$MOD_VERSION"

      - name: Attach the jar to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" build/libs/*.jar

      # loaders/game-versions/dependencies are read automatically from the jar's own neoforge.mods.toml (see
      # https://github.com/Kira-NT/mc-publish#-inputs for what's auto-resolved).
      - name: Publish to CurseForge
        uses: Kira-NT/mc-publish@995edadc13559a8b28d0b7e6571229f067ec7659 # v3.3.0
        with:
          curseforge-id: 1595080
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          name: ${{ needs.release-please.outputs.tag_name }}
          version: ${{ needs.release-please.outputs.version }}
          changelog: ${{ needs.release-please.outputs.body }}

      # Publishing makes the release immutable. The tag already exists, so this creates no tag.
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --draft=false
